name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, types, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test (screenshots of every screen)
        run: npx playwright test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            test-results/screens/
            playwright-report/
          retention-days: 14

  python:
    name: Python (lint, tests, benchmarks, notebook smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: >-
          pip install -e "python[test,notebooks,jax,train]"
          --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check
      - run: ruff format --check
      - run: pytest
      - name: Notebooks match their sources
        run: python -m treesvb.notebooks check
      - name: Golden outputs match the solver
        run: python -m treesvb.golden --check
      - name: docs/validation.md matches results/
        run: python -m treesvb.validate --check
      - name: Benchmarks on small grids
        run: python -m treesvb.benchmarks --quick
      - name: Street studies on small grids
        run: python -m treesvb.street all --quick
      - name: Run notebooks in CPU smoke mode
        run: python -m treesvb.notebooks smoke

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trees vs Breath: solver self-test</title>
    <script>
      try {
        var p = localStorage.getItem('tvb-theme') || 'system';
        var dark =
          p === 'dark' ||
          (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg text-ink antialiased">
    <main id="root" class="mx-auto max-w-3xl px-4 py-8"></main>
    <script type="module" src="/src/selftest/main.ts"></script>
  </body>
</html>
